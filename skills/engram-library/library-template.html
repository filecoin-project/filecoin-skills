<!doctype html>
<html><head><meta charset="utf-8"><title>engram library</title>
<style>
@font-face{font-family:Satoshi;src:url(data:font/ttf;base64,{{SATOSHI_B64}}) format('truetype');font-weight:300 900;font-display:swap}
html{overflow-x:hidden}
body{background:#F7F3ED;color:#0D1B3D;font-family:Satoshi,Inter,system-ui,sans-serif;max-width:960px;margin:2rem auto;padding:0 1rem;position:relative;overflow-x:hidden}
.rose{position:fixed;top:-40px;right:-60px;width:340px;opacity:.92;pointer-events:none;z-index:-1}
.wash1{position:fixed;bottom:-80px;left:-100px;width:480px;opacity:.55;pointer-events:none;z-index:-1}
.wash2{position:fixed;top:-60px;left:30%;width:420px;opacity:.35;pointer-events:none;z-index:-1;transform:rotate(160deg)}
.logo{display:block;width:min(520px,90vw);height:auto;margin:-1.4rem 0 -1.5rem;transform:translateX(-7.5%)}
h1{font-weight:700;letter-spacing:-.02em;margin:.2rem 0 0}
.sub{color:#7A8DFF;margin:0 0 .3rem}
.checkrow{display:flex;flex-direction:column;align-items:flex-start;gap:.5rem;margin:0 0 1.2rem}
.checkline{color:#6b7280;font-size:.85rem;margin:0}
.sync-row{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.sync-btn{border:1px solid rgba(74,85,198,.18);background:linear-gradient(135deg,#E9EBFF,#F1F2FF);color:#4A55C6;font:inherit;font-size:.78rem;font-weight:600;border-radius:12px;padding:.4rem .8rem;cursor:pointer;text-align:left;box-shadow:0 1px 2px rgba(13,27,61,.05);transition:transform .12s ease,box-shadow .12s ease}
.sync-btn:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(74,85,198,.18)}
.sync-btn:active{transform:translateY(0)}
.sync-copied{color:#18634b;font-size:.78rem;font-weight:600;opacity:0;transition:opacity .15s ease}
.sync-copied.show{opacity:1}
.toolbar{display:flex;gap:.6rem;margin:0 0 1.2rem}
#search{flex:1 1 auto;min-width:0;box-sizing:border-box;padding:.55rem .7rem;border:1px solid #C2C6F1;border-radius:9px;background:#fff;color:#0D1B3D;font:inherit}
#search::placeholder{color:#9aa0ac}
.filter-dd{position:relative;flex:0 0 auto}
.filter-dd-btn{display:flex;align-items:center;gap:.5rem;box-sizing:border-box;padding:.55rem .8rem;border:1px solid #C2C6F1;border-radius:9px;background:#fff;color:#0D1B3D;font:inherit;font-size:.85rem;cursor:pointer;white-space:nowrap}
.filter-dd-btn:hover{background:#FAFAFF;border-color:#C9CCF5}
.filter-dd-caret{color:#7A8DFF;font-size:.65rem;transition:transform .12s ease}
.filter-dd.open .filter-dd-caret{transform:rotate(180deg)}
.filter-dd-list{position:absolute;top:calc(100% + 6px);right:0;min-width:240px;max-height:280px;overflow:auto;background:#fff;border:1px solid #E4E6FA;border-radius:14px;box-shadow:0 14px 34px rgba(13,27,61,.12);padding:.4rem;margin:0;list-style:none;z-index:30}
.filter-dd-list[hidden]{display:none}
.filter-dd-list li{padding:.5rem .65rem;border-radius:9px;font-size:.85rem;color:#0D1B3D;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.filter-dd-list li:hover{background:#F3F0FF}
.filter-dd-list li.selected{background:#E9EBFF;color:#4A55C6;font-weight:600}
.filter-dd-list li .check{opacity:0;color:#4A55C6;font-size:.8rem}
.filter-dd-list li.selected .check{opacity:1}
h2.section{font-size:.95rem;text-transform:uppercase;letter-spacing:.08em;color:#0D1B3D;margin:1.6rem 0 .5rem}
h2.section .count{color:#7A8DFF;text-transform:none;letter-spacing:normal;font-weight:400}
.table-wrap{margin-bottom:1.5rem}
table{width:100%;table-layout:fixed;border-collapse:collapse;background:rgba(247,243,237,.82);margin-bottom:0}
th{text-align:left;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:#7A8DFF;border-bottom:2px solid #C2C6F1;padding:.5rem .6rem}
td{padding:.5rem .6rem;border-bottom:1px solid #C2C6F1;vertical-align:top}
.rows-table th:nth-child(1),.rows-table td:nth-child(1){width:30%}
.rows-table th:nth-child(2),.rows-table td:nth-child(2){width:12%;white-space:nowrap}
.rows-table th:nth-child(3),.rows-table td:nth-child(3){width:22%;white-space:nowrap}
.rows-table th:nth-child(4),.rows-table td:nth-child(4){width:18%;white-space:nowrap}
.rows-table th:nth-child(5),.rows-table td:nth-child(5){width:18%;color:#6b7280;font-size:.85rem;overflow-wrap:anywhere}
.history-table th:nth-child(1),.history-table td:nth-child(1){width:38%}
.history-table th:nth-child(2),.history-table td:nth-child(2){width:15%;white-space:nowrap}
.history-table th:nth-child(3),.history-table td:nth-child(3){width:47%;color:#6b7280;font-size:.85rem;overflow-wrap:anywhere}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:#4A55C6}
.sort-indicator{display:inline-block;width:.9em}
tr.no-match td{color:#6b7280;font-style:italic;text-align:center}
.pager{display:flex;align-items:center;gap:.6rem;justify-content:flex-end;padding:.4rem .6rem;font-size:.8rem;color:#6b7280}
.pager button{border:1px solid #C2C6F1;background:#fff;color:#0D1B3D;border-radius:6px;padding:.15rem .55rem;font:inherit;cursor:pointer}
.pager button:disabled{opacity:.4;cursor:default}
.copies{display:block;color:#6b7280;font-size:.85rem;margin-top:.15rem}
.meta{display:block;color:#6b7280;font-size:.8rem;margin-top:.15rem}
.tag{display:inline-block;background:#E9EBFF;color:#4A55C6;font-size:.72rem;font-weight:600;border-radius:5px;padding:.05rem .35rem;margin-left:.4rem;vertical-align:middle;white-space:normal}
.tag.warn{background:#FFF1D8;color:#9a5d0b}
.file-cell{font-weight:600}
tr.attention td{background:#FFFBF2}
tr.history{opacity:.62}
a{color:#7A8DFF}
tr:hover td{background:#FFFFFF}
.discovery{margin-top:2rem;padding-top:1rem;border-top:1px dashed #C2C6F1}
.discovery p{color:#6b7280;font-size:.85rem}
.discovery table{opacity:.85}
.footer{margin:2.5rem 0 1rem;padding-top:1rem;border-top:1px solid #E4E6FA;color:#9aa0ac;font-size:.78rem;text-align:center}
.footer a{color:#7A8DFF}
.footer code{background:#F3F0FF;color:#4A55C6;padding:.05rem .3rem;border-radius:5px;font-size:.9em}
@media(max-width:600px){.logo{transform:translateX(-4%)}}
</style></head>
<body>
<img class="rose" alt="" src="data:image/png;base64,{{ROSE_B64}}">
<img class="wash1" alt="" src="data:image/png;base64,{{WASH_B64}}">
<img class="wash2" alt="" src="data:image/png;base64,{{WASH_B64}}">
<img class="logo" alt="Engram" src="data:image/png;base64,{{LOGO_B64}}">
<h1>engram library</h1>
<p class="sub">Your agent's memory, made to last.</p>
<div class="checkrow">
<p class="checkline">{{CHECK_LINE}}</p>
<div class="sync-row">
{{SYNC_BUTTON}}
<span class="sync-copied" id="syncCopied">Copied — paste it to your agent</span>
</div>
</div>
<div class="toolbar"><input id="search" type="text" placeholder="Search by name, note, catalog source, or data set…" autocomplete="off"><div class="filter-dd" id="sourceFilterWrap"><button type="button" class="filter-dd-btn" id="sourceFilterBtn" aria-haspopup="listbox" aria-expanded="false" aria-label="Filter by catalog or data-set source"><span id="sourceFilterLabel">All</span><span class="filter-dd-caret">▾</span></button><ul class="filter-dd-list" id="sourceFilterList" role="listbox" hidden></ul></div></div>
{{SECTIONS}}
{{DISCOVERY_SECTION}}
<footer class="footer">Built with 💙 by <a href="https://github.com/jennijuju/engram">engram</a> — <code>engram-share</code> + <code>engram-library</code></footer>
<script>
(function(){
  var syncBtn = document.getElementById('syncBtn');
  var syncCopied = document.getElementById('syncCopied');
  if (syncBtn) {
    syncBtn.addEventListener('click', function(){
      var phrase = syncBtn.getAttribute('data-copy') || 'check my shares on Filecoin';
      var done = function(){
        syncCopied.classList.add('show');
        clearTimeout(syncBtn._t);
        syncBtn._t = setTimeout(function(){ syncCopied.classList.remove('show'); }, 2200);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(phrase).then(done, done);
      } else {
        done();
      }
    });
  }

  var PAGE_SIZE = 8;
  var search = document.getElementById('search');
  var filterWrap = document.getElementById('sourceFilterWrap');
  var filterBtn = document.getElementById('sourceFilterBtn');
  var filterLabel = document.getElementById('sourceFilterLabel');
  var filterList = document.getElementById('sourceFilterList');
  var currentSource = '';
  var currentSourceLabel = 'All';
  if (!search) return;
  var groups = Array.prototype.map.call(document.querySelectorAll('.table-wrap'), function(wrap){
    return {
      wrap: wrap,
      table: wrap.querySelector('table'),
      tbody: wrap.querySelector('tbody'),
      rows: Array.prototype.filter.call(wrap.querySelectorAll('tbody tr'), function(r){ return r.hasAttribute('data-date'); }),
      noMatch: wrap.querySelector('tr.no-match'),
      sortHeader: wrap.querySelector('th.sortable'),
      prev: wrap.querySelector('.pager .prev'),
      next: wrap.querySelector('.pager .next'),
      pageinfo: wrap.querySelector('.pager .pageinfo'),
      pager: wrap.querySelector('.pager'),
      page: 0,
      sortDir: null
    };
  });

  function selectSource(value, label, li){
    currentSource = value;
    currentSourceLabel = label;
    filterLabel.textContent = label;
    filterList.querySelectorAll('li').forEach(function(el){ el.classList.toggle('selected', el === li); });
    closeFilter();
    groups.forEach(function(g){ g.page = 0; renderGroup(g); });
  }

  function openFilter(){ filterList.hidden = false; filterWrap.classList.add('open'); filterBtn.setAttribute('aria-expanded', 'true'); }
  function closeFilter(){ filterList.hidden = true; filterWrap.classList.remove('open'); filterBtn.setAttribute('aria-expanded', 'false'); }

  if (filterBtn) {
    var sources = {};
    groups.forEach(function(g){ g.rows.forEach(function(r){ var s = r.getAttribute('data-source'); if (s) sources[s] = true; }); });
    var allLi = document.createElement('li');
    allLi.setAttribute('role', 'option');
    allLi.className = 'selected';
    allLi.innerHTML = '<span>All</span><span class="check">\u2713</span>';
    allLi.addEventListener('click', function(){ selectSource('', 'All', allLi); });
    filterList.appendChild(allLi);
    Object.keys(sources).sort().forEach(function(s){
      var label = s === 'local' ? 'Catalog source: local' : 'Data-set source: ' + s;
      var li = document.createElement('li');
      li.setAttribute('role', 'option');
      li.innerHTML = '<span>' + label + '</span><span class="check">\u2713</span>';
      li.addEventListener('click', function(){ selectSource(s, label, li); });
      filterList.appendChild(li);
    });
    filterBtn.addEventListener('click', function(){ filterList.hidden ? openFilter() : closeFilter(); });
    document.addEventListener('click', function(e){ if (filterWrap && !filterWrap.contains(e.target)) closeFilter(); });
    document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeFilter(); });
  }

  function dateKey(row, dir){
    var d = row.getAttribute('data-date');
    if (!d) return dir === 'asc' ? '9999-99-99' : '0000-00-00';
    return d;
  }

  function noMatchText(q){
    var hasQuery = !!q;
    var hasSource = !!currentSource;
    if (hasQuery && hasSource) return 'No matches for \u201c' + q + '\u201d in ' + currentSourceLabel + '.';
    if (hasQuery) return 'No matches for \u201c' + q + '\u201d.';
    if (hasSource) return 'No items in ' + currentSourceLabel + '.';
    return 'No items.';
  }

  function renderGroup(g){
    var q = search.value.trim().toLowerCase();
    var visible = g.rows.filter(function(r){
      var matchesSearch = !q || (r.getAttribute('data-search') || '').indexOf(q) !== -1;
      var matchesSource = !currentSource || r.getAttribute('data-source') === currentSource;
      return matchesSearch && matchesSource;
    });
    if (g.sortDir) {
      visible = visible.slice().sort(function(a, b){
        var ka = dateKey(a, g.sortDir), kb = dateKey(b, g.sortDir);
        if (ka === kb) return 0;
        var cmp = ka < kb ? -1 : 1;
        return g.sortDir === 'asc' ? cmp : -cmp;
      });
    }
    var totalPages = Math.max(1, Math.ceil(visible.length / PAGE_SIZE));
    g.page = Math.min(g.page, totalPages - 1);
    var start = g.page * PAGE_SIZE;
    var pageRows = visible.slice(start, start + PAGE_SIZE);
    var pageSet = new Map();
    pageRows.forEach(function(r){ pageSet.set(r, true); });
    pageRows.forEach(function(r){ g.tbody.appendChild(r); });
    g.rows.forEach(function(r){ r.style.display = pageSet.has(r) ? '' : 'none'; });
    if (g.noMatch) {
      g.noMatch.style.display = visible.length === 0 ? '' : 'none';
      var cell = g.noMatch.querySelector('td');
      if (cell) cell.textContent = noMatchText(q);
      g.tbody.appendChild(g.noMatch);
    }
    if (g.pager) g.pager.style.display = totalPages > 1 ? '' : 'none';
    if (g.pageinfo) g.pageinfo.textContent = 'Page ' + (g.page + 1) + ' of ' + totalPages;
    if (g.prev) g.prev.disabled = g.page === 0;
    if (g.next) g.next.disabled = g.page >= totalPages - 1;
  }

  groups.forEach(function(g){
    renderGroup(g);
    if (g.prev) g.prev.addEventListener('click', function(){ g.page--; renderGroup(g); });
    if (g.next) g.next.addEventListener('click', function(){ g.page++; renderGroup(g); });
    if (g.sortHeader) g.sortHeader.addEventListener('click', function(){
      g.sortDir = g.sortDir === 'desc' ? 'asc' : (g.sortDir === 'asc' ? null : 'desc');
      var indicator = g.sortHeader.querySelector('.sort-indicator');
      if (indicator) indicator.textContent = g.sortDir === 'asc' ? '\u25B2' : (g.sortDir === 'desc' ? '\u25BC' : '\u21c5');
      g.page = 0;
      renderGroup(g);
    });
  });

  var debounce;
  search.addEventListener('input', function(){
    clearTimeout(debounce);
    debounce = setTimeout(function(){
      groups.forEach(function(g){ g.page = 0; renderGroup(g); });
    }, 80);
  });
})();
</script>
</body></html>
